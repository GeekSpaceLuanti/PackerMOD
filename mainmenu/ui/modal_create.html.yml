root:
  tag: page
  class: modal-page
  children:
    - tag: spacer
      class: modal-vspacer
    - tag: div
      class: modal-center-row
      children:
        - tag: spacer
          class: modal-hspacer
        - tag: card
          class: "modal-card modal-card-wide"
          children:
            - tag: h2
              class: modal-title
              text: "${step_title}"
            - tag: span
              class: modal-dim
              text: "${step_help}"
            - tag: section
              class: modal-create-col
              when: "${show_details}"
              children:
                - tag: div
                  class: modal-row
                  children:
                    - tag: field
                      class: modal-field-create-grow
                      attrs:
                        name: pack_name
                        label: "Pack name"
                        default: "${pack_name}"
                    - tag: field
                      class: modal-field-create
                      attrs:
                        name: pack_author
                        label: Author
                        default: "${pack_author}"
                - tag: textarea
                  class: form-textarea
                  attrs:
                    name: pack_description
                    label: Description
                    default: "${pack_description}"
            - tag: section
              class: modal-create-body
              when: "${show_game}"
              children:
                - tag: div
                  class: modal-create-col
                  children:
                    - tag: div
                      class: modal-row
                      children:
                        - tag: field
                          class: modal-field-create-grow
                          attrs:
                            name: game_query
                            label: "Game search"
                            default: "${game_query}"
                        - tag: button
                          class: modal-btn
                          attrs:
                            name: game_search
                            label: Search
                    - tag: list
                      class: catalog-list
                      attrs:
                        name: game_list
                        items: "${game_items}"
                        selected: "${game_selected}"
                - tag: div
                  class: modal-create-col
                  children:
                    - tag: h2
                      class: modal-section-label
                      text: "${selected_game_title}"
                    - tag: dropdown
                      class: catalog-version
                      attrs:
                        name: game_release
                        label: "Base game version"
                        items: "${version_items}"
                        selected: "${release_selected}"
                    - tag: span
                      class: modal-dim
                      text: "The selected game release is installed when the pack is created."
            - tag: div
              class: modal-create-body
              when: "${show_mods}"
              children:
                - tag: div
                  class: modal-create-col
                  children:
                    - tag: div
                      class: modal-row
                      children:
                        - tag: field
                          class: modal-field-create-grow
                          attrs:
                            name: search_query
                            label: "Find MODs on ContentDB"
                            default: "${search_query}"
                        - tag: button
                          class: modal-btn
                          attrs:
                            name: search
                            label: Search
                    - tag: list
                      class: catalog-list
                      attrs:
                        name: search_results
                        items: "${search_results | format_search_result}"
                        selected: "${search_selected}"
                    - tag: button
                      class: modal-btn
                      attrs:
                        name: add_search
                        label: "Add to pack"
                - tag: div
                  class: modal-create-col
                  children:
                    - tag: span
                      class: modal-section-label
                      text: "MODs in this pack"
                    - tag: list
                      class: catalog-list
                      attrs:
                        name: mod_list
                        items: "${mods | format_mod_entry}"
                        selected: "${mod_selected}"
                    - tag: button
                      class: modal-btn
                      attrs:
                        name: remove_mod
                        label: Remove
            - tag: status
              class: modal-status
              text: "${status}"
            - tag: footer
              class: modal-actions
              children:
                - tag: button
                  class: modal-btn
                  attrs:
                    name: dlg_close
                    label: Cancel
                - tag: button
                  class: modal-btn
                  when: "${has_previous}"
                  attrs:
                    name: previous_step
                    label: Back
                - tag: button
                  class: modal-btn-primary
                  when: "${has_next}"
                  attrs:
                    name: next_step
                    label: "${next_label}"
                - tag: button
                  class: modal-btn-primary
                  when: "${show_mods}"
                  attrs:
                    name: export
                    label: "Create pack"
        - tag: spacer
          class: modal-hspacer
    - tag: spacer
      class: modal-vspacer
