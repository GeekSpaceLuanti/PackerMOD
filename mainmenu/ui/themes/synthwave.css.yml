# Clean dark theme. Dimensions are in formspec units.
rules:
  - selector: "page"
    style:
      bg: "#13171D"
      padding: 0.8
      flex-direction: column
      gap: 0.5
  - selector: ".title-bar"
    style:
      flex-direction: row
      justify: space-between
      align: center
      h: 1.2
  - selector: "#title"
    style:
      color: "#F2F5F8"
      font-size: "*1.8"
  - selector: ".subtitle"
    style:
      color: "#98A5B3"
      font-size: "*1.0"
  - selector: ".action-bar"
    style:
      flex-direction: row
      justify: end
      gap: 0.3
      h: 1.0
  - selector: ".action-btn"
    style:
      h: 1.0
      bg: "#2B333E"
      color: "#EDF2F7"
  - selector: ".primary-btn"
    style:
      bg: "#59D9AD"
      color: "#10251D"
  - selector: ".pack-grid"
    style:
      display: grid
      grid-columns: 3
      gap: 0.45
      flex: 1
  - selector: ".pack-card"
    style:
      bg: "#202731"
      padding: 0.3
      flex-direction: column
      align: center
      gap: 0.15
      w: 9.0
      h: 4.5
  - selector: ".pack-card-placeholder"
    style:
      w: 9.0
      h: 4.5
  - selector: ".pack-thumb"
    style:
      w: 2.6
      h: 2.6
  - selector: ".pack-name"
    style:
      color: "#EDF2F7"
      font-size: "*1.1"
      h: 0.5
  - selector: ".pack-meta"
    style:
      color: "#98A5B3"
      font-size: "*0.9"
      h: 0.4
  - selector: ".pagination"
    style:
      flex-direction: row
      justify: end
      align: center
      gap: 0.4
      h: 0.9
  - selector: ".page-label"
    style:
      color: "#98A5B3"
      font-size: "*1.0"
  - selector: ".page-btn"
    style:
      h: 0.9
  - selector: ".empty-state"
    style:
      flex: 1
      align: center
      flex-direction: column
      gap: 0.4
  - selector: ".empty-title"
    style:
      color: "#EDF2F7"
      font-size: "*1.6"
      h: 0.8
  - selector: ".empty-help"
    style:
      color: "#98A5B3"
      h: 0.7
  - selector: ".grow"
    style:
      flex: 1
  - selector: ".detail-header"
    style:
      flex-direction: row
      align: center
      gap: 0.6
      h: 1.1
  - selector: ".back-btn"
    style:
      h: 1.0
  - selector: ".detail-title"
    style:
      color: "#EDF2F7"
      font-size: "*1.5"
  - selector: ".detail-spacer"
    style:
      flex: 1
  - selector: ".detail-meta"
    style:
      w: 10.0
      color: "#98A5B3"
      font-size: "*0.9"
  - selector: ".subtab-bar"
    style:
      flex-direction: row
      gap: 0.2
      h: 1.0
  - selector: ".subtab-btn"
    style:
      flex: 1
      h: 1.0
      bg: "#202731"
      color: "#B1BCC8"
  - selector: ".subtab-btn-active"
    style:
      bg: "#59D9AD"
      color: "#10251D"
  - selector: ".subtab-pane"
    style:
      flex: 1
      flex-direction: column
      gap: 0.5
      bg: "#202731"
      padding: 0.5
  - selector: ".detail-list"
    style:
      flex: 1
      bg: "#171D25"
      color: "#EDF2F7"
  - selector: ".empty-status"
    style:
      color: "#98A5B3"
      h: 0.7
  - selector: ".subtab-actions"
    style:
      flex-direction: row
      justify: end
      gap: 0.3
      h: 1.0
  - selector: ".form-row"
    style:
      align: end
      flex-direction: row
      gap: 0.4
  - selector: ".form-field"
    style:
      flex: 1
      h: 1.0
      bg: "#171D25"
      color: "#EDF2F7"
  - selector: ".form-field-narrow"
    style:
      w: 4.0
      h: 1.0
      bg: "#171D25"
      color: "#EDF2F7"
  - selector: ".form-textarea"
    style:
      h: 2.4
      bg: "#171D25"
      color: "#EDF2F7"
  - selector: ".mods-grid"
    style:
      flex: 1
      flex-direction: row
      gap: 0.6
  - selector: ".mods-col"
    style:
      flex: 1
      flex-direction: column
      gap: 0.3
  - selector: ".mods-col-title"
    style:
      color: "#98A5B3"
      font-size: "*1.1"
      h: 0.7
  - selector: ".info-base"
    style:
      color: "#98A5B3"
  - selector: ".modal-page"
    style:
      bg: "#13171D"
      padding: 0.8
      flex-direction: column
  - selector: ".modal-vspacer"
    style:
      flex: 1
  - selector: ".modal-center-row"
    style:
      flex-direction: row
  - selector: ".modal-hspacer"
    style:
      flex: 1
  - selector: ".modal-card"
    style:
      bg: "#202731"
      padding: 0.7
      flex-direction: column
      gap: 0.4
      w: 21.0
  - selector: ".modal-card-narrow"
    style:
      w: 16.0
  - selector: ".modal-card-mid"
    style:
      w: 21.0
  - selector: ".modal-title"
    style:
      color: "#EDF2F7"
      font-size: "*1.5"
      h: 1.0
  - selector: ".modal-dim"
    style:
      color: "#98A5B3"
      font-size: "*0.9"
  - selector: ".modal-info"
    style:
      color: "#EDF2F7"
      h: 0.6
  - selector: ".modal-status"
    style:
      color: "#98A5B3"
      h: 0.8
  - selector: ".modal-field"
    style:
      h: 1.0
      bg: "#171D25"
      color: "#EDF2F7"
  - selector: ".modal-actions"
    style:
      flex-direction: row
      justify: end
      gap: 0.3
      h: 1.0
  - selector: ".modal-btn"
    style:
      h: 1.0
      bg: "#2B333E"
      color: "#EDF2F7"
  - selector: ".modal-btn-primary"
    style:
      h: 1.0
      bg: "#59D9AD"
      color: "#10251D"
  - selector: ".modal-btn-danger"
    style:
      h: 1.0
      bg: "#713B45"
      color: "#FFE7EC"
  - selector: ".modal-icon-btn"
    style:
      h: 1.0
  - selector: ".modal-row"
    style:
      align: end
      flex-direction: row
      gap: 0.5
  - selector: ".modal-field-grow"
    style:
      flex: 1
      h: 1.0
      bg: "#171D25"
      color: "#EDF2F7"
  - selector: ".modal-field-create"
    style:
      flex: 1
      h: 1.0
      bg: "#171D25"
      color: "#EDF2F7"
  - selector: ".modal-field-create-grow"
    style:
      flex: 2
      h: 1.0
      bg: "#171D25"
      color: "#EDF2F7"
  - selector: ".modal-icon-btn-small"
    style:
      h: 1.0
  - selector: ".modal-list"
    style:
      flex: 1
      bg: "#171D25"
      color: "#EDF2F7"
  - selector: ".modal-create-body"
    style:
      flex: 1
      flex-direction: row
      gap: 0.6
  - selector: ".modal-create-col"
    style:
      flex: 1
      flex-direction: column
      gap: 0.4
  - selector: ".modal-section-label"
    style:
      color: "#98A5B3"
      font-size: "*1.0"
      h: 0.7
  - selector: ".modal-card-wide"
    style:
      w: 28.4
      h: 14.4
  - selector: ".info-name"
    style:
      flex: 0
  - selector: "#btn-play-world"
    style:
      bg: "#59D9AD"
      color: "#10251D"
  - selector: "#btn-server-connect"
    style:
      bg: "#59D9AD"
      color: "#10251D"
  - selector: "#btn-info-save"
    style:
      bg: "#59D9AD"
      color: "#10251D"
  - selector: ".catalog-list"
    style:
      flex: 1
      h: 4.0
      color: "#EDF2F7"
  - selector: ".catalog-version"
    style:
      h: 1.0
  - selector: ".catalog-info"
    style:
      color: "#98A5B3"
      h: 1.0

  - selector: ".settings-header"
    style:
      flex-direction: row
      align: center
      gap: 0.6
  - selector: ".settings-language"
    style:
      w: 6.0
      h: 1.0
  - selector: ".settings-body"
    style:
      flex-direction: row
      gap: 0.6
      flex: 1
  - selector: ".settings-navigation"
    style:
      flex-direction: column
      gap: 0.4
      flex: 1
  - selector: ".engine-setting-list"
    style:
      h: 6.0
      flex: 1
  - selector: ".settings-editor"
    style:
      flex: 2
      gap: 0.4
      h: 10.0
  - selector: ".engine-title"
    style:
      font-size: "*1.3"
      color: "#EDF2F7"
      h: 0.9
  - selector: ".engine-description"
    style:
      h: 1.8
  - selector: ".engine-bounds"
    style:
      h: 0.7
  - selector: ".engine-fields"
    style:
      flex-direction: column
      gap: 0.4
  - selector: ".engine-key-list"
    style:
      h: 2.0
  - selector: ".settings-footer"
    style:
      flex-direction: row
      align: center
      gap: 0.5
  - selector: ".settings-restart-note"
    style:
      flex: 1
      h: 0.8

  - selector: ".engine-query"
    style:
      flex: 0

  # Pack detail: compact horizontal navigation and a clear primary action.
  - selector: "#pack-detail"
    style:
      gap: 0.35
  - selector: ".pack-detail-top"
    style:
      flex-direction: row
      align: center
      h: 0.85
  - selector: ".detail-back"
    style:
      w: 5.0
      h: 0.8
      bg: "#13171D"
      color: "#A5B4AF"
      font-size: "*0.9"
  - selector: ".detail-brand"
    style:
      w: 3.0
      h: 0.6
      color: "#A5B4AF"
      font-size: "*0.9"
  - selector: ".pack-detail-hero"
    style:
      flex-direction: row
      align: center
      gap: 0.55
      h: 2.2
  - selector: ".detail-pack-icon"
    style:
      w: 1.45
      h: 1.45
  - selector: ".detail-heading"
    style:
      flex: 1
      min-w: 4
      flex-direction: column
      gap: 0.15
  - selector: "#pack-detail .detail-title"
    style:
      h: 0.85
      font-size: "*1.65"
  - selector: "#pack-detail .detail-meta"
    style:
      h: 0.55
      w: 12
      color: "#A5B4AF"
      font-size: "*0.85"
  - selector: ".detail-new-world"
    style:
      w: 5.4
      h: 0.9
      bg: "#59D9AD"
      color: "#10251D"
  - selector: "#pack-detail .subtab-bar"
    style:
      h: 0.95
      gap: 0.18
      border-bottom-width: 0.025
      border-bottom-color: "#34413E"
  - selector: "#pack-detail .subtab-btn"
    style:
      flex: 1
      min-w: 2.6
      w: 4.8
      h: 0.9
      bg: "#13171D"
      color: "#A5B4AF"
      font-size: "*0.9"
  - selector: "#pack-detail .subtab-btn-active"
    style:
      bg: "#263E35"
      color: "#8CE0B7"
  - selector: "#pack-detail .subtab-pane"
    style:
      bg: "#13171D"
      padding: 0
      gap: 0.3
  - selector: ".detail-section-title"
    style:
      h: 0.65
      color: "#EDF2F7"
      font-size: "*1.2"
  - selector: ".detail-section-help"
    style:
      h: 0.55
      color: "#A5B4AF"
      font-size: "*0.85"
  - selector: ".detail-world-empty"
    style:
      flex: 1
      flex-direction: column
      justify: center
      align: center
      gap: 0.35
      padding: 0.5
      bg: "#1B232A"
      border-width: 0.025
      border-color: "#34413E"
  - selector: ".detail-empty-icon"
    style:
      w: 0.9
      h: 0.9
  - selector: ".detail-empty-title"
    style:
      h: 0.75
      color: "#EDF2F7"
      font-size: "*1.25"
  - selector: ".detail-empty-help"
    style:
      h: 0.6
      color: "#A5B4AF"
      font-size: "*0.9"
  - selector: ".detail-danger-row"
    style:
      flex-direction: row
      align: center
      gap: 0.3
      h: 1.25
      border-top-width: 0.025
      border-top-color: "#34413E"
  - selector: ".detail-danger-help"
    style:
      w: 16
      h: 0.6
      color: "#A5B4AF"
      font-size: "*0.85"
  - selector: ".detail-danger-btn"
    style:
      w: 5.4
      h: 0.9
      bg: "#39292E"
      color: "#FFB8BD"
  - selector: ".detail-description"
    style:
      h: 1.8
  - selector: ".detail-world-list"
    style:
      flex: 0
      h: 3.2
  - selector: ".detail-empty-mods"
    style:
      h: 1.4
      color: "#A5B4AF"
      font-size: "*0.9"
