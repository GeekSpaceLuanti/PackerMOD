# Legacy PMUI 1 compatibility fixture.
# Current Pack Detail is composed by pack_detail.lua + pack_detail.css (PMUI 2).
#
# 4 subtab (Worlds / Multiplayer / Mods / Info) を when: で出し分ける。

root:
  tag: page
  id: pack-detail
  attrs:
    layout: flow
  children:

    # ヘッダ: Back / Pack タイトル / メタ情報
    - tag: header
      class: pack-detail-top
      children:
        - tag: icon-button
          id: btn-back
          class: detail-back
          attrs:
            name: btn_back
            icon: folder
            label: "Back to Library"
        - tag: spacer
          class: detail-spacer
        - tag: span
          class: detail-brand
          text: PackerMOD

    - tag: header
      class: pack-detail-hero
      children:
        - tag: img
          class: detail-pack-icon
          attrs:
            src: "${pack_icon}"
        - tag: div
          class: detail-heading
          children:
            - tag: h1
              id: detail-title
              class: detail-title
              text: "${pack_name}"
            - tag: span
              id: detail-meta
              class: detail-meta
              text: "v${pack_version}   ${pack_base}   ${pack_mods_count} mods"
        - tag: icon-button
          class: detail-new-world
          when: "${has_world}"
          attrs:
            name: new_world
            label: "New World"

    # subtab buttons (active 状態は ${subtab_class_*} で動的にクラスを付与)
    - tag: nav
      class: subtab-bar
      children:
        - tag: button
          id: subtab-worlds
          class: "subtab-btn ${subtab_class_worlds}"
          attrs:
            name: subtab_worlds
            label: Worlds
        - tag: button
          id: subtab-multi
          class: "subtab-btn ${subtab_class_multi}"
          attrs:
            name: subtab_multi
            label: Multiplayer
        - tag: button
          id: subtab-mods
          class: "subtab-btn ${subtab_class_mods}"
          attrs:
            name: subtab_mods
            label: Mods
        - tag: button
          id: subtab-info
          class: "subtab-btn ${subtab_class_info}"
          attrs:
            name: subtab_info
            label: Info

    # ===== Worlds subtab =====
    - tag: section
      class: subtab-pane
      when: "${show_worlds}"
      children:
        - tag: h2
          class: detail-section-title
          text: Worlds
        - tag: span
          class: detail-section-help
          text: "Manage the worlds in this pack"
        - tag: list
          class: "detail-list detail-world-list"
          when: "${has_world}"
          attrs:
            name: worldlist
            items: "${worlds | format_world_label}"
            selected: "${selected_world}"
            transparent: true
        - tag: div
          class: detail-world-empty
          when: "${no_world}"
          children:
            - tag: img
              class: detail-empty-icon
              attrs:
                src: "${pack_icon}"
            - tag: h2
              class: detail-empty-title
              text: "Create your first world"
            - tag: span
              class: detail-empty-help
              text: "Create a new world to start playing."
            - tag: button
              id: btn-new-world
              class: detail-new-world
              attrs:
                name: new_world
                label: "New World"
        - tag: footer
          class: subtab-actions
          when: "${has_world}"
          children:
            - tag: icon-button
              id: btn-edit-world
              class: "action-btn"
              when: "${has_world}"
              attrs:
                name: edit_world
                label: "Edit world"
            - tag: icon-button
              id: btn-delete-world
              class: action-btn
              when: "${has_world}"
              attrs:
                name: delete_world
                icon: trash
                label: Delete
            - tag: icon-button
              id: btn-play-world
              class: action-btn
              when: "${has_world}"
              attrs:
                name: play_world
                icon: play
                label: Play
        - tag: span
          class: detail-section-help
          text: "Worlds are saved separately for each pack."

    # ===== Multiplayer subtab =====
    - tag: section
      class: subtab-pane
      when: "${show_multi}"
      children:
        - tag: h2
          class: detail-section-title
          text: Multiplayer
        - tag: list
          class: detail-list
          when: "${has_server}"
          attrs:
            name: serverlist
            items: "${servers | format_server_label}"
            selected: "${selected_server}"
        - tag: status
          class: empty-status
          when: "${no_server}"
          text: "No servers yet. Fill the form below and press Add."
        - tag: div
          class: form-row
          children:
            - tag: field
              class: form-field
              attrs:
                name: server_name
                label: Name
                default: "${form_server_name}"
            - tag: field
              class: form-field
              attrs:
                name: server_address
                label: Address
                default: "${form_server_address}"
            - tag: field
              class: form-field-narrow
              attrs:
                name: server_port
                label: Port
                default: "${form_server_port}"
        - tag: footer
          class: subtab-actions
          children:
            - tag: icon-button
              id: btn-server-add
              class: action-btn
              attrs:
                name: server_add
                icon: plus
                label: Add
            - tag: icon-button
              id: btn-server-remove
              class: action-btn
              when: "${has_server}"
              attrs:
                name: server_remove
                icon: trash
                label: Remove
            - tag: icon-button
              id: btn-server-connect
              class: action-btn
              when: "${has_server}"
              attrs:
                name: server_connect
                icon: play
                label: Connect

    # ===== Mods subtab =====
    - tag: section
      class: subtab-pane
      when: "${show_mods}"
      children:
        - tag: h2
          class: detail-section-title
          text: Mods
        - tag: div
          class: form-row
          children:
            - tag: field
              class: form-field
              attrs:
                name: search_query
                label: "Search ContentDB"
                default: "${search_query}"
            - tag: field
              class: form-field-narrow
              attrs:
                name: search_release
                label: Release
                default: "${search_release}"
            - tag: icon-button
              id: btn-search
              class: action-btn
              attrs:
                name: do_search
                icon: search
                label: Search
        - tag: status
          class: empty-status
          text: "${mod_status}"
        - tag: div
          class: mods-grid
          children:
            - tag: div
              class: mods-col
              children:
                - tag: h2
                  class: mods-col-title
                  text: "Current"
                - tag: list
                  class: detail-list
                  when: "${has_pack_mods}"
                  attrs:
                    name: mod_list
                    items: "${pack_mods | format_mod_entry}"
                    selected: "${selected_mod}"
                - tag: paragraph
                  class: detail-empty-mods
                  when: "${no_pack_mods}"
                  text: "No additional mods in this pack."
                - tag: icon-button
                  id: btn-mod-remove
                  class: action-btn
                  when: "${has_mod}"
                  attrs:
                    name: mod_remove
                    icon: trash
                    label: Remove
            - tag: div
              class: mods-col
              children:
                - tag: h2
                  class: mods-col-title
                  text: "Search results"
                - tag: list
                  class: detail-list
                  when: "${has_search_results}"
                  attrs:
                    name: search_results
                    items: "${search_results | format_search_result}"
                    selected: "${selected_search}"
                - tag: paragraph
                  class: detail-empty-mods
                  when: "${no_search_results}"
                  text: "Search ContentDB to find mods."
                - tag: icon-button
                  id: btn-mod-add
                  class: action-btn
                  when: "${has_search_result}"
                  attrs:
                    name: mod_add
                    icon: plus
                    label: Add

    # ===== Info subtab =====
    - tag: section
      class: subtab-pane
      when: "${show_info}"
      children:
        - tag: h2
          class: detail-section-title
          text: Info
        - tag: field
          class: "form-field info-name"
          attrs:
            name: info_name
            label: Name
            default: "${pack_name}"
        - tag: span
          class: modal-dim
          text: "Pack revision: ${pack_version} (automatic)"
        - tag: textarea
          class: "form-textarea detail-description"
          attrs:
            name: info_description
            label: Description
            default: "${pack_description}"
        - tag: status
          class: empty-status
          when: "${has_info_status}"
          text: "${info_status}"
        - tag: footer
          class: subtab-actions
          children:
            - tag: icon-button
              id: btn-info-save
              class: action-btn
              attrs:
                name: info_save
                icon: save
                label: "Save Changes"
        - tag: div
          class: detail-danger-row
          children:
            - tag: span
              class: detail-danger-help
              text: "Deleting this pack also deletes its worlds."
            - tag: button
              class: detail-danger-btn
              attrs:
                name: delete_pack
                label: "Delete Pack"
