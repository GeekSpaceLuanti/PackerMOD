root:
  tag: page
  id: pack-library
  children:
    - tag: header
      class: title-bar
      children:
        - tag: h1
          id: title
          text: "${title_text}"
        - tag: span
          class: subtitle
          text: "Pack library"
    - tag: nav
      class: action-bar
      children:
        - tag: button
          class: action-btn
          attrs:
            name: btn_import
            label: Import pack
        - tag: button
          class: "action-btn primary-btn"
          attrs:
            name: btn_create
            label: Create pack
        - tag: button
          class: action-btn
          attrs:
            name: btn_settings
            label: Settings
    - tag: section
      class: empty-state
      when: "${no_packs}"
      children:
        - tag: spacer
          class: grow
        - tag: h2
          class: empty-title
          text: "A home for your next world"
        - tag: span
          class: empty-help
          text: "Create your first pack, or import one to get started."
        - tag: button
          class: "action-btn primary-btn"
          attrs:
            name: empty_create
            label: Create a pack
        - tag: spacer
          class: grow
    - tag: main
      class: pack-grid
      when: "${has_packs}"
      children:
        - tag: card
          class: pack-card
          for:
            each: pack
            in: packs
          children:
            - tag: icon-button
              class: pack-thumb
              attrs:
                name: "${pack.name_attr}"
                icon: "${pack.thumbnail}"
                label: ""
            - tag: h2
              class: pack-name
              text: "${pack.name}"
            - tag: span
              class: pack-meta
              text: "${pack.base_label}"
        - tag: card
          class: pack-card-placeholder
          for:
            each: _
            in: placeholders
    - tag: footer
      class: pagination
      children:
        - tag: span
          class: page-label
          text: "${page_label}"
        - tag: button
          class: page-btn
          when: "${has_previous}"
          attrs:
            name: page_previous
            label: Previous
        - tag: button
          class: page-btn
          when: "${has_next}"
          attrs:
            name: page_next
            label: Next
