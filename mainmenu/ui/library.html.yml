# PackerMOD 画面1 (Pack Library) の HTML 風 DSL。
# 対応する style は mainmenu/ui/themes/<theme>.css.yml。
# library.lua の build_grid_formspec_pmui がこのファイルを読み込む。

root:
  tag: page
  id: pack-library
  children:
    - tag: header
      class: title-bar
      children:
        # neon.html 準拠の 2 色化。markup 属性に library.lua が組み立てた hypertext
        # markup (<style color> の 2 span) を差し込む。#title の font-size は効くが
        # color は出さない (markup 側の per-span color を上書きしないため)。
        - tag: h1
          id: title
          attrs:
            markup: "${title_markup}"
        - tag: span
          id: subtitle
          class: subtitle
          text: "// PACK_LIBRARY"

    - tag: span
      id: no-packs-msg
      when: "${no_packs}"
      text: "No packs yet. Use Import or Create below to add one."

    # pack が 0 個のときは grid を出さない (flex:1 の空 grid が縦空間を食って
    # no-packs-msg が中央に来ないため)。空状態は no-packs-msg が content 全体を占める。
    - tag: main
      class: pack-grid
      when: "${has_packs}"
      children:
        - tag: card
          class: pack-card
          for:
            each: pack
            in: packs
          children:
            # thumb は正方形なので full 幅にせず、行 (justify center) で中央に置く。
            # name/meta はカード全幅に広げて halign=center で中央寄せ (折返し回避)。
            - tag: div
              class: thumb-row
              children:
                - tag: icon-button
                  class: pack-thumb
                  attrs:
                    name: "${pack.name_attr}"
                    icon: "${pack.thumbnail}"
                    label: ""
            - tag: h2
              class: pack-name
              text: "${pack.name}"
            - tag: span
              class: pack-meta
              text: "${pack.base_label}"
        # 残り列を埋めるプレースホルダのテンプレ (1 個)。pmui の grid が最終行の
        # 空きセル数だけこれをクローンして並べる (列数は grid-columns: auto から導出)。
        - tag: card
          class: pack-card-placeholder

    - tag: footer
      class: action-bar
      children:
        - tag: icon-button
          id: btn-import
          class: action-btn
          attrs:
            name: btn_import
            icon: download
            label: Import
        - tag: icon-button
          id: btn-create
          class: action-btn
          attrs:
            name: btn_create
            icon: plus
            label: Create
        - tag: icon-button
          id: btn-settings
          class: action-btn
          attrs:
            name: btn_settings
            icon: sliders
            label: Settings
