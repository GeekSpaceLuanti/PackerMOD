# PackerMOD 画面1 (Pack Library) の HTML 風 DSL。
# 対応する style は mainmenu/ui/themes/<theme>.css.yml。
# library.lua の build_grid_formspec_pmui がこのファイルを読み込む。

root:
  tag: page
  id: pack-library
  children:
    - tag: header
      class: title-bar
      children:
        # neon.html 準拠の 2 色化。text は library.lua が組み立てた ESC 込みの
        # ${title_text} を差し込む (yaml は "\x1b" 系エスケープを解釈しないため)。
        # CSS の #title で color を指定するとレイアウト側で ESC prefix が上書きされて
        # 結果的に単色化するので、テーマ側は #title 用の color を出さず、text 側の
        # ESC で色を持たせる。
        - tag: h1
          id: title
          text: "${title_text}"
        - tag: span
          id: subtitle
          class: subtitle
          text: "// PACK_LIBRARY"

    - tag: span
      id: no-packs-msg
      when: "${no_packs}"
      text: "No packs yet. Use Import or Create below to add one."

    - tag: main
      class: pack-grid
      children:
        - tag: card
          class: pack-card
          for:
            each: pack
            in: packs
          children:
            - tag: icon-button
              class: pack-thumb
              attrs:
                name: "${pack.name_attr}"
                icon: "${pack.thumbnail}"
                label: ""
            - tag: h2
              class: pack-name
              text: "${pack.name}"
            - tag: span
              class: pack-meta
              text: "${pack.base_label}"
        # 残り列を埋めるプレースホルダ。pack 数 % cols の空き分だけ並ぶ。
        - tag: card
          class: pack-card-placeholder
          for:
            each: _
            in: placeholders

    - tag: footer
      class: action-bar
      children:
        - tag: icon-button
          id: btn-import
          class: action-btn
          attrs:
            name: btn_import
            icon: download
            label: Import
        - tag: icon-button
          id: btn-create
          class: action-btn
          attrs:
            name: btn_create
            icon: plus
            label: Create
        - tag: icon-button
          id: btn-settings
          class: action-btn
          attrs:
            name: btn_settings
            icon: sliders
            label: Settings
