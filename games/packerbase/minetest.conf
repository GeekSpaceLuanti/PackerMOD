# PackerMOD Base defaults, modified 2026-11-05.
# This is only a walking-speed starting point, not Java movement emulation.
# Engine setting: movement_speed_walk (blocks/second); users can override it.
movement_speed_walk = 4.317

# Luanti 5.16 applies the block-size factor twice to acceleration. Values
# 2.4 and 0.8 give 24 blocks/s² on ground and 8 in the air. Keep the native
# fast mode within the same speed as Base sprinting.
movement_acceleration_default = 2.4
movement_acceleration_air = 0.8
movement_acceleration_fast = 2.4
movement_speed_fast = 5.6121

# PackerMOD contributors, modified 2026-11-09: approximate Java Edition
# dry-land falling/jump timing and crouch speed with Luanti's native physics.
# Luanti's dry-land player physics doubles the configured gravity.
movement_gravity = 14
movement_speed_jump = 8.6
movement_speed_crouch = 1.295
